name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies & build frontend
      run: |
        if [ -f frontend/package.json ]; then
          cd frontend
          npm ci
          npm run build
        else
          echo "Frontend directory not yet initialized; skipping frontend build."
        fi
